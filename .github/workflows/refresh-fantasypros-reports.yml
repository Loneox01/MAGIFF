name: Refresh FantasyPros reports

on:
  schedule:
    # 24 provider requests/day at most; the application ledger independently
    # enforces a 40/day budget below FantasyPros' 50/day limit.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      report_limit:
        description: Reports requested in the single provider call
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: fantasypros-report-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_REPORT_METADATA_MODEL: gpt-5.6-luna
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      REPORT_LIMIT: ${{ inputs.report_limit || '20' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch, process, embed, and load reports
        run: >-
          python -m jobs.refresh_reports
          --limit "${REPORT_LIMIT}"
          --daily-request-budget 40
          --trigger github_actions
